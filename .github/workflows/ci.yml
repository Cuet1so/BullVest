name: BullVest CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build & Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Unit & Billing Tests
        run: |
          npm test
          npm run test:billing

      - name: Validate Market Data Source and Simulated Ticker
        run: |
          npx deno check --config supabase/functions/market-data-ingest/deno.json supabase/functions/market-data-ingest/index.ts
          npx deno test --config supabase/functions/market-data-ingest/deno.json supabase/functions/market-data-ingest/provider_test.ts
          npx deno test --allow-env --config supabase/functions/market-ticker/deno.json supabase/functions/market-ticker/index_test.ts

      - name: Build Production Bundle
        run: npm run build
